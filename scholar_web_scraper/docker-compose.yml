version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: scholar_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    
  celery_worker:
    build: 
      context: .
      dockerfile: Dockerfile.celery
    container_name: scholar_celery
    command: celery -A infrastructure.celery_tasks.celery_config worker --loglevel=info
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./results:/app/results
      - .:/app
    restart: unless-stopped

volumes:
  redis_data:
    driver: local